<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- SEO meta tags are injected at build time via scripts/inject-seo-build.ts -->
    <!-- These defaults are crawler-safe fallbacks when DB injection is unavailable -->
    <title>Skale Club | Data-Driven Marketing & Scalable Growth</title>
    <meta name="description" content="Skale Club helps businesses scale with data-driven marketing systems, automation, and growth strategy." />
    <link rel="canonical" href="https://skale.club/" />
    <meta property="og:url" content="https://skale.club/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skale Club" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Skale Club | Data-Driven Marketing & Scalable Growth" />
    <meta property="og:description" content="Skale Club helps businesses scale with data-driven marketing systems, automation, and growth strategy." />
    <meta property="og:image" content="https://skale.club/favicon-rounded.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skale Club | Data-Driven Marketing & Scalable Growth" />
    <meta name="twitter:description" content="Skale Club helps businesses scale with data-driven marketing systems, automation, and growth strategy." />
    <meta name="twitter:image" content="https://skale.club/favicon-rounded.png" />
    <meta name="theme-color" content="#0d121a" />
    <meta name="application-name" content="Skale Club" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skale Club" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Pre-React theme bootstrap — applies `dark` or `light` class to <html>
      // BEFORE React renders, so theme-aware Tailwind classes (bg-background,
      // text-foreground, etc.) work correctly on the very first paint.
      // Mirrors the rules in client/src/context/ThemeContext.tsx.
      // Without this, full-screen loaders / route guards flash the wrong theme
      // during the gap between HTML parse and React mount.
      (function () {
        // Universal chrome-tint bootstrap. Applied on EVERY route so mobile
        // Safari + Chrome / PWA shells sample the correct theme color from
        // first paint. Without this, Safari can lock in a light tint on
        // initial paint that no React effect can later override.
        var LIGHT_BG = "#FFFFFF";
        var DARK_BG  = "#0d121a";

        function setMeta(name, content) {
          var m = document.querySelector('meta[name="' + name + '"]');
          if (!m) {
            m = document.createElement("meta");
            m.setAttribute("name", name);
            document.head.appendChild(m);
          }
          m.setAttribute("content", content);
        }

        function applyChrome(theme) {
          var bg = theme === "dark" ? DARK_BG : LIGHT_BG;
          var root = document.documentElement;
          root.style.backgroundColor = bg;
          root.style.colorScheme = theme;
          setMeta("theme-color", bg);
          setMeta("color-scheme", theme);
          function paintBody() {
            if (document.body) document.body.style.backgroundColor = bg;
          }
          paintBody();
          if (!document.body) document.addEventListener("DOMContentLoaded", paintBody);
        }

        try {
          // The whole Skale Club site is dark by design. Two exceptions:
          //  - Admin login & signup have a dedicated LIGHT design, so they are
          //    forced light from first paint (otherwise color-scheme:dark leaks
          //    into the inputs / autofill).
          //  - The admin themeable area honors the user's stored preference.
          // Everything else (public site, landings, /e/, /p/, xpot) is dark.
          var path = window.location.pathname;
          var isAuthPage = path === "/admin/login" || path === "/admin/signup";
          var isAdminThemeable = path.indexOf("/admin") === 0 && !isAuthPage;

          var theme = "dark";
          if (isAuthPage) {
            theme = "light";
          } else if (isAdminThemeable) {
            var stored = null;
            try { stored = localStorage.getItem("skale-club-admin-theme"); } catch (e) {}
            if (stored === "light") {
              theme = "light";
            } else if (stored === "system") {
              theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            // else stored is 'dark' or unset — keep default dark
          }
          document.documentElement.classList.add(theme);
          applyChrome(theme);
        } catch (e) {
          document.documentElement.classList.add("dark");
          try { applyChrome("dark"); } catch (_) {}
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Critical site fonts (render-blocking, small) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: #0d121a;">
      <div class="loader-dots">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>
    <style>
      #initial-loader {
        opacity: 0;
        animation: loaderFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes loaderFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .loader-fade-out {
        opacity: 0 !important;
        transition: opacity 0.15s ease-out;
      }
      .loader-dots {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: scale(0.6) translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: scale(1) translateY(-8px);
          opacity: 1;
        }
      }
      .loader-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #5173D6;
        animation: dotBounce 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .loader-dot:nth-child(1) { animation-delay: 0s; }
      .loader-dot:nth-child(2) { animation-delay: 0.16s; }
      .loader-dot:nth-child(3) { animation-delay: 0.32s; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
