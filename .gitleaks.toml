# Gitleaks configuration — extends the built-in default rule set.
# Docs: https://github.com/gitleaks/gitleaks#configuration

[extend]
# Inherit every default rule (AWS, GCP, Stripe, Slack, OAuth, generic, etc.).
useDefault = true

# Global allowlist — paths / regexes whitelisted across all rules.
# Use sparingly. Each entry needs a justification comment.
[[allowlists]]
description = "Historical Neon Postgres password from the Replit era (early 2026), abandoned when the project migrated to Supabase. The Neon database is no longer in use — the password points at a decommissioned host. Suppressed here so CI is not perpetually red over a credential that has no real attack surface. DO NOT use this pattern (per-commit suppression) for any LIVE secret — for those, rotate first, suppress second (or never)."
# Commit 88bec040 was a Replit auto-checkpoint that landed
# .claude/settings.local.json before .gitignore covered the directory.
# The project later migrated off Replit/Neon to its own infra on Supabase.
commits = ["88bec0406db2cbe9604c49d9fc9c6abb286d2b75"]

[[allowlists]]
description = "Documentation placeholders, plan/verification examples, and .env.example templates"
paths = [
    # All planning docs include curl examples with placeholder Bearer tokens
    # (e.g., 'Bearer wrongtoken' for negative-path testing) and seed files
    # may mention obvious example keys like '0x4AAAAAAA-replace-me'.
    '''\.planning/.*''',
    # Public-by-design env template — values are placeholders only.
    '''\.env\.example''',
    # Gitleaks config itself contains regex patterns that look like secrets.
    '''\.gitleaks\.toml''',
]
regexes = [
    # Explicit placeholder tokens used across docs.
    '''wrongtoken''',
    '''replace-me''',
    '''your-[a-z-]+-(key|secret|hash)''',
    '''\[project-ref\]''',
    '''example\.hash\.here''',
]

[[allowlists]]
description = "token-crypto.test.ts round-trips a fake OpenRouter-shaped key as plaintext input to encryptToken/decryptToken — a made-up fixture, never a real credential."
# Deliberately narrow: ONLY the exact fixture value, ONLY for the
# generic-api-key rule, ONLY in this test file (condition = AND). Any other
# secret added to this file — or this value anywhere else — is still flagged.
# Matching on the value (not a .gitleaksignore fingerprint) keeps working if
# the line moves and in non-git scans (gitleaks dir / protect --staged).
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
    '''(^|/)server/blog/__tests__/token-crypto\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
    '''^sk-or-v1-abcdef0123456789$''',
]
