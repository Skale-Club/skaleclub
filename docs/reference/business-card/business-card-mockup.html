<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skale Club Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --skale-blue: #1C53A3;
      --action-blue: #5173D6;
      --ink: #18181B;
      --paper: #FCFCFD;
      --ink-soft: #3F3F46;

      --page-bg: #E7E7EA;
      --chrome-text: #18181B;
      --chrome-muted: #5B5B63;
      --chrome-line: #CFCFD4;

      --g-bleed: #E5484D;
      --g-trim: #00B8D9;
      --g-safe: #22C55E;

      /* 1 inch of card in CSS px. Everything inside a face is derived from it. */
      --in: 120px;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: #E7E7EA;
      color: var(--chrome-text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 16px 64px;
    }

    /* ---------- Mockup chrome ---------- */
    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
      margin-bottom: 32px;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }
    .toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 10px;
      border: 1px solid var(--chrome-line);
      border-radius: 999px;
      background: #fff;
      color: var(--chrome-text);
      font: 600 13px/1 "Inter", system-ui, sans-serif;
      cursor: pointer;
    }
    .toggle:hover { border-color: #A9A9B1; }
    .toggle:focus-visible { outline: 2px solid var(--action-blue); outline-offset: 2px; }
    .toggle .dot {
      width: 26px; height: 16px; border-radius: 999px;
      background: #C9C9CF; position: relative; transition: background .15s;
    }
    .toggle .dot::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 12px; height: 12px; border-radius: 50%; background: #fff;
      transition: transform .15s;
    }
    .toggle[aria-pressed="true"] .dot { background: var(--skale-blue); }
    .toggle[aria-pressed="true"] .dot::after { transform: translateX(10px); }

    .legend {
      display: none;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: -16px 0 24px;
      font-size: 12px;
      color: var(--chrome-muted);
    }
    body.guides .legend { display: flex; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
    .legend .l-bleed i { border-color: var(--g-bleed); }
    .legend .l-trim i  { border-color: var(--g-trim); }
    .legend .l-safe i  { border-top-style: dashed; border-color: var(--g-safe); }

    .faces {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
    }
    .slot { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; min-width: 0; }
    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--chrome-muted);
    }
    .faces .face { box-shadow: 0 1px 2px rgba(24,24,27,.10), 0 10px 28px rgba(24,24,27,.20); }

    .qr-note {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--chrome-muted);
      max-width: calc(var(--in) * 3.5);
    }

    section.real {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--chrome-line);
    }
    section.real h2 {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 600;
    }
    .real .faces { --in: 96px; justify-content: flex-start; gap: 24px; }
    .real .faces .face { box-shadow: 0 0 0 1px rgba(24,24,27,.08); }

    .spec {
      margin: 40px 0 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      color: var(--chrome-muted);
      line-height: 1.7;
    }
    .spec b { color: var(--chrome-text); font-weight: 600; }

    /* ---------- Card faces (physical model) ----------
       .face   = crop window. Trim size by default, full bleed canvas when guides are on.
       .canvas = full bleed canvas (3.75 x 2.25 in). Artwork extends all the way to its edge.
       Units: calc(var(--in) * inches). Type: calc(var(--in) * pt / 72). */
    .face {
      position: relative;
      flex: none;
      width: calc(var(--in) * 3.5);
      height: calc(var(--in) * 2);
      overflow: hidden;
      border-radius: 0;
    }
    body.guides .face {
      width: calc(var(--in) * 3.75);
      height: calc(var(--in) * 2.25);
    }
    .canvas {
      position: absolute;
      left: calc(var(--in) * -0.125);
      top: calc(var(--in) * -0.125);
      width: calc(var(--in) * 3.75);
      height: calc(var(--in) * 2.25);
      overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.guides .canvas { left: 0; top: 0; }

    /* FRONT */
    .canvas.front { background: var(--skale-blue); }
    .front .logo {
      position: absolute;
      left: calc(var(--in) * 0.25);
      bottom: calc(var(--in) * 0.25);
      height: calc(var(--in) * 1.15);
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .front .url {
      position: absolute;
      top: calc(var(--in) * 0.25);
      right: calc(var(--in) * 0.25);
      font-size: calc(var(--in) * 7 / 72);
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .6);
      white-space: nowrap;
      /* trailing letter-spacing would push the last glyph off the safe edge */
      margin-right: -0.14em;
    }

    /* BACK */
    .canvas.back {
      --sw: calc(var(--in) * 2 / 120);   /* bracket stroke: 2px at 120px/in */
      background: var(--paper);
      color: var(--ink);
    }
    .back .info {
      position: absolute;
      left: calc(var(--in) * 0.25);
      top: calc(var(--in) * 0.25);
      bottom: calc(var(--in) * 0.25);
      width: calc(var(--in) * 2.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .back .name {
      margin: 0;
      font-size: calc(var(--in) * 13 / 72);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
    }
    .back .rule {
      width: calc(var(--in) * 0.35);
      height: var(--sw);
      margin: calc(var(--in) * 0.1) 0 calc(var(--in) * 0.09);
      background: var(--skale-blue);
    }
    .back .lines {
      font-size: calc(var(--in) * 7.5 / 72);
      line-height: 1.6;
      font-weight: 400;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .back .lines div { display: block; }
    .back .lines a { color: inherit; text-decoration: none; }

    .back .qr {
      position: absolute;
      right: calc(var(--in) * 0.33);   /* QR edge + 0.06in gap + stroke = exactly the 0.25in safe edge */
      top: 50%;
      width: calc(var(--in) * 0.95);
      height: calc(var(--in) * 0.95);
      transform: translateY(-50%);
    }
    .back .qr svg { display: block; width: 100%; height: 100%; }
    .back .qr .fallback {
      display: grid; place-items: center; width: 100%; height: 100%;
      background: #fff; color: var(--ink-soft);
      font-size: calc(var(--in) * 5 / 72); text-align: center;
    }
    /* Open bracket echoing the logo: top-right + bottom-left L corners */
    .back .qr::before,
    .back .qr::after {
      content: "";
      position: absolute;
      width: calc(var(--in) * 0.3);
      height: calc(var(--in) * 0.3);
      border: 0 solid var(--skale-blue);
      pointer-events: none;
    }
    .back .qr::before {
      top: calc(var(--in) * -0.06 - var(--sw));
      right: calc(var(--in) * -0.06 - var(--sw));
      border-top-width: var(--sw);
      border-right-width: var(--sw);
    }
    .back .qr::after {
      bottom: calc(var(--in) * -0.06 - var(--sw));
      left: calc(var(--in) * -0.06 - var(--sw));
      border-bottom-width: var(--sw);
      border-left-width: var(--sw);
    }

    /* 0.08in visible inside the trim + the 0.125in bleed below it */
    .back .band {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: calc(var(--in) * (0.125 + 0.08));
      background: var(--skale-blue);
    }

    /* Print guides (hidden unless toggled) */
    .guides-layer { display: none; position: absolute; inset: 0; pointer-events: none; }
    body.guides .guides-layer { display: block; }
    .guides-layer i { position: absolute; display: block; }
    .g-bleed { inset: 0; border: 1px solid var(--g-bleed); }
    .g-trim  { inset: calc(var(--in) * 0.125); border: 1px solid var(--g-trim); }
    .g-safe  { inset: calc(var(--in) * 0.25);  border: 1px dashed var(--g-safe); }

    /* ---------- Responsive ---------- */
    @media (max-width: 699px) {
      :root { --in: 80px; }
      .real .faces { --in: 80px; }
      .page { padding-top: 24px; }
      .faces { gap: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>Business card — Vanildo de Souza Jr</h1>
      <button class="toggle" id="guides-toggle" type="button" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span><span>Mostrar guias</span>
      </button>
    </header>

    <div class="legend" aria-hidden="true">
      <span class="l-bleed"><i></i>Sangria (borda do arquivo)</span>
      <span class="l-trim"><i></i>Corte (trim)</span>
      <span class="l-safe"><i></i>Área segura</span>
    </div>

    <div class="faces" id="large">
      <div class="slot">
        <div class="label">Frente</div>
        <div class="face-host" data-face="front"></div>
      </div>
      <div class="slot">
        <div class="label">Verso</div>
        <div class="face-host" data-face="back"></div>
        <p class="qr-note">QR → skale.club/vcard/vanildo (vCard ainda não criado)</p>
      </div>
    </div>

    <section class="real">
      <h2>Tamanho real</h2>
      <div class="faces" id="real">
        <div class="face-host" data-face="front"></div>
        <div class="face-host" data-face="back"></div>
      </div>
    </section>

    <ul class="spec">
      <li><b>3,5 × 2 pol (88,9 × 50,8 mm)</b> · sangria 1/8 pol · área segura 1/8 pol · frente/verso</li>
    </ul>
  </main>

  <template id="tpl-front">
    <div class="face">
      <div class="canvas front">
        <img class="logo" src="logo-main.png" alt="Skale Club" width="1106" height="1116" draggable="false">
        <div class="url">skale.club</div>
        <div class="guides-layer" aria-hidden="true"><i class="g-bleed"></i><i class="g-trim"></i><i class="g-safe"></i></div>
      </div>
    </div>
  </template>

  <template id="tpl-back">
    <div class="face">
      <div class="canvas back">
        <div class="info">
          <p class="name">Vanildo de Souza Jr</p>
          <div class="rule"></div>
          <div class="lines">
            <div><a href="tel:+15088018190">(508) 801-8190</a></div>
            <div>vanildo@skale.club</div>
            <div>skale.club</div>
          </div>
        </div>
        <div class="qr" data-qr="https://skale.club/vcard/vanildo" role="img" aria-label="QR code: skale.club/vcard/vanildo"></div>
        <div class="band"></div>
        <div class="guides-layer" aria-hidden="true"><i class="g-bleed"></i><i class="g-trim"></i><i class="g-safe"></i></div>
      </div>
    </div>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    (function () {
      // Build the QR once as inline SVG paths (crisp at any scale).
      function buildQrSvg(text) {
        if (typeof qrcode !== 'function') return null;
        var qr = qrcode(0, 'M');           // auto version, error correction M
        qr.addData(text);
        qr.make();
        var n = qr.getModuleCount();
        var quiet = 4;                      // quiet zone in modules
        var size = n + quiet * 2;
        var d = '';
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            if (qr.isDark(r, c)) d += 'M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z';
          }
        }
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '"' +
          ' shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
          '<rect width="' + size + '" height="' + size + '" fill="#FFFFFF"/>' +
          '<path d="' + d + '" fill="#18181B"/></svg>';
      }

      var qrSvg = null;
      try { qrSvg = buildQrSvg('https://skale.club/vcard/vanildo'); } catch (e) { qrSvg = null; }

      document.querySelectorAll('.face-host').forEach(function (host) {
        var tpl = document.getElementById('tpl-' + host.getAttribute('data-face'));
        host.appendChild(tpl.content.cloneNode(true));
      });

      document.querySelectorAll('.qr').forEach(function (el) {
        if (qrSvg) el.innerHTML = qrSvg;
        else el.innerHTML = '<div class="fallback">QR indisponível<br>(sem acesso à biblioteca)</div>';
      });

      var btn = document.getElementById('guides-toggle');
      btn.addEventListener('click', function () {
        var on = document.body.classList.toggle('guides');
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
