name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Disposable database for the *.pg.test.ts suites.
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway, job-local database: no password to leak or to flag.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Postgres tests
        run: npm run test:pg
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres

      - name: Build
        run: npm run build

      # Browser tests against the build above, in Chrome's, Firefox's and
      # Safari's engines (versions pinned by the exact `playwright` devDependency).
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e:run
        env:
          E2E_BROWSERS: chromium,firefox,webkit

      - name: Dependency audit (high and above, prod deps only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
