name: Data Retention

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: retention
      cancel-in-progress: false
    steps:
      - name: Call retention endpoint
        env:
          RETENTION_URL: https://skale.club/api/cron/retention
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing secret: CRON_SECRET"
            exit 1
          fi

          response_file="$(mktemp)"
          set +e
          status=$(curl --silent --show-error \
            --request POST \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --max-time 120 \
            --connect-timeout 10 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$RETENTION_URL")
          curl_exit=$?
          set -e

          cat "$response_file"
          echo
          if [ "$curl_exit" -ne 0 ] || [ "$status" != "200" ]; then
            echo "Retention call failed (curl=$curl_exit, http=$status)"
            exit 1
          fi
